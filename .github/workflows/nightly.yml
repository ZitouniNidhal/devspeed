name: Nightly health check

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Full quality check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run development quality script
        run: python scripts/dev.py check

      - name: Verify package metadata
        run: python -c "import importlib.metadata as m; print(m.metadata('devspeed')['Version'])"
