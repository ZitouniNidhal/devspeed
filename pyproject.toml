[project]
name = "devspeed"
version = "0.1.0"
description = "Lightning-fast local dev environment manager"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
devspeed = "devspeed.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["devspeed", "devspeed.stacks"]
