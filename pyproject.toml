[project]
name = "devspeed"
version = "0.1.0"
description = "Lightning-fast local dev environment manager"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "ruff>=0.6",
]

[project.scripts]
devspeed = "devspeed.cli:main"

[project.entry-points."devspeed.stacks"]
# Third-party packages publish their plugin entry points in this group.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["devspeed", "devspeed.stacks"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py39"
